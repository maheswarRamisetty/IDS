project:
  name: Data_Drift_IDS
  version: 1.0.0

data:
  raw_path: data/raw/
  processed_path: data/processed/
  splits_path: data/splits/
  window_path: data/splits/window_data/
  train_file: train_data.csv
  test_file: test_data.csv
  preprocessed_file: preprocessed_data.csv
  features_file: feature_engineered.csv

model:
  model_path: models/saved_models/
  initial_model: initial_model.pkl
  retrained_model: retrained_model.pkl
  feature_importance_path: models/feature_importance/
  
training:
  test_size: 0.2
  random_state: 42
  target_column: Label
  validation_size: 0.1
  n_estimators: 100
  max_depth: 10
  learning_rate: 0.1
  subsample: 0.8
  
drift:
  ks_threshold: 0.05
  psi_threshold: 0.1
  window_size: 10000
  step_size: 5000
  confidence_level: 0.95
  min_samples: 1000
  
evaluation:
  metrics: ['accuracy', 'precision', 'recall', 'f1', 'roc_auc']
  classification_threshold: 0.5
  use_cross_validation: true
  cv_folds: 5
  
logging:
  log_path: logs/
  drift_log: drift_monitoring.log
  training_log: model_training.log
  performance_log: performance_tracking.log
  
results:
  plots_path: results/plots/
  metrics_path: results/metrics/
  reports_path: results/reports/
  alerts_path: results/alerts/
  
visualization:
  figsize_width: 12
  figsize_height: 8
  dpi: 300
  style: seaborn
  color_palette: Set2