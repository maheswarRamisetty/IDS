data:
  raw_path: "../data/raw"
  processed_path: "../data/processed"
  splits_path: "../data/splits"
  
  files: [
    "Monday-WorkingHours.pcap_ISCX.csv",
    "Tuesday-WorkingHours.pcap_ISCX.csv",
    "Wednesday-WorkingHours.pcap_ISCX.csv",
    "Thursday-WorkingHours-Afternoon-Infilteration.pcap_ISCX.csv",
    "Thursday-WorkingHours-Morning-WebAttacks.pcap_ISCX.csv",
    "Friday-WorkingHours-Afternoon-DDos.pcap_ISCX.csv",
    "Friday-WorkingHours-Afternoon-PortScan.pcap_ISCX.csv",
    "Friday-WorkingHours-Morning.pcap_ISCX.csv"
  ]
  
  features:
    numerical_columns: [
      "Destination Port", "Flow Duration", "Total Fwd Packets", 
      "Total Backward Packets", "Total Length of Fwd Packets",
      "Total Length of Bwd Packets", "Fwd Packet Length Max",
      "Fwd Packet Length Min", "Fwd Packet Length Mean",
      "Fwd Packet Length Std", "Flow Bytes/s", "Flow Packets/s",
      "Flow IAT Mean", "Flow IAT Std", "Flow IAT Max", "Flow IAT Min"
    ]
    
  categorical_columns: [
    "Fwd PSH Flags", "Bwd PSH Flags", "Fwd URG Flags",
    "Bwd URG Flags", "FIN Flag Count", "SYN Flag Count",
    "RST Flag Count", "PSH Flag Count", "ACK Flag Count",
    "URG Flag Count", "CWE Flag Count", "ECE Flag Count"
  ]
  
  target_column: "Label"
  
model:
  model_type: "random_forest"
  test_size: 0.3
  validation_size: 0.1
  random_state: 42
  
  random_forest:
    n_estimators: 150
    max_depth: 25
    min_samples_split: 5
    min_samples_leaf: 2
    n_jobs: -1
    
  xgboost:
    n_estimators: 200
    max_depth: 12
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    
drift_detection:
  window_size: 5000
  drift_threshold_ks: 0.1
  drift_threshold_psi: 0.2
  n_features_drift: 5
  detection_frequency: 1000
  
paths:
  figs_dir: "./figs"
  logs_dir: "./logs"
  results_dir: "./results"
  model_save: "./models/trained/ids_model.joblib"
  scaler_save: "./models/trained/scaler.joblib"
  drift_detector_save: "./models/drift_detectors/drift_detector.joblib"
  
logging:
  log_level: "INFO"
  log_format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  log_file: "ids_pipeline.log"